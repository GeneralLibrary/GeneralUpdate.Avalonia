name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet package version (SemVer 2.0, e.g. 1.0.0, 1.0.0-beta.1)'
        required: true
        type: string
      push-to-nuget:
        description: 'Push package to NuGet.org'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SemVer 2.0
        run: |
          if ! echo "${{ inputs.version }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' > /dev/null; then
            echo "::error::Invalid SemVer 2.0 version: '${{ inputs.version }}'"
            exit 1
          fi
          echo "Version ${{ inputs.version }} is valid SemVer 2.0"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore GeneralUpdate.Avalonia.slnx

      - name: Build
        run: dotnet build GeneralUpdate.Avalonia.slnx --configuration Release --no-restore /p:Version=${{ inputs.version }}

      - name: Run tests
        run: dotnet test GeneralUpdate.Avalonia.slnx --configuration Release --no-restore --no-build /p:Version=${{ inputs.version }}

      - name: Pack NuGet
        run: dotnet pack GeneralUpdate.Avalonia.slnx --configuration Release --no-restore --no-build -o artifacts /p:Version=${{ inputs.version }}

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          TAG="v${{ inputs.version }}"
          git tag --force "$TAG"
          git push --force origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" --json tagName &>/dev/null; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            artifacts/*.nupkg \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      - name: Push NuGet package to NuGet.org (Trusted Publishing via OIDC)
        if: ${{ inputs.push-to-nuget == true }}
        run: |
          # Step 1: Get OIDC token from GitHub Actions runtime
          ID_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://www.nuget.org" | jq -r '.value')
          echo "OIDC token obtained (length: ${#ID_TOKEN})"

          # Step 2: Exchange OIDC token for a short-lived NuGet API key
          echo "Exchanging token at https://www.nuget.org/api/v2/token..."
          RESPONSE=$(curl -sSL -w "\n%{http_code}" -X POST "https://www.nuget.org/api/v2/token" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$ID_TOKEN\",\"username\":\"juster.chu\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Token exchange failed with HTTP $HTTP_CODE"
            exit 1
          fi

          NUGET_API_KEY=$(echo "$RESPONSE_BODY" | jq -r '.apiKey')

          # Step 3: Push the package
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
